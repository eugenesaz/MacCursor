name: Release

# Push a tag like v0.2.0 to build, sign and publish build/MacCursor-0.2.0.zip plus the
# update feed. Any failed step publishes nothing. See docs/releasing.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?( |$)" {f=1; next} /^## / {f=0} f' \
            CHANGELOG.md > build/notes.md
          if ! grep -q '[^[:space:]]' build/notes.md; then
            echo "CHANGELOG.md has no '## [$version]' section with notes" >&2
            exit 1
          fi

      - run: ./scripts/check.sh

      - name: Import the release signing identity
        env:
          P12_BASE64: ${{ secrets.RELEASE_IDENTITY_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.RELEASE_IDENTITY_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "Missing RELEASE_IDENTITY_P12_BASE64 secret (see docs/releasing.md)" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_pass="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Self-signed: trust it for code signing, or codesign rejects the identity.
          security find-certificate -c "MacCursor Release" -p "$keychain" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm "$RUNNER_TEMP/id.p12"

      - name: Build the release zip
        env:
          CODESIGN_IDENTITY: MacCursor Release
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Pack the starter style template
        run: |
          bin="$(swift build -c release --show-bin-path)/MacCursor"
          "$bin" --pack docs/style-template -o build/style-template.maccursorstyle

      - name: Write the update feed (appcast.xml)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          public_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Resources/Info.plist)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/MacCursor-$version.zip"
          ./scripts/sparkle.sh appcast "$version" "build/MacCursor-$version.zip" "$url" \
            build/notes.md "$public_key" > build/appcast.xml
          xmllint --noout build/appcast.xml

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/MacCursor-$version.zip" "build/MacCursor-$version.zip.sha256" \
            build/appcast.xml build/style-template.maccursorstyle \
            --title "MacCursor $version" --notes-file build/notes.md
