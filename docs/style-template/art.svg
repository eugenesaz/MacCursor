<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>My style</title>
  <!-- 1 unit = 1 point at 1x size. The click point (hotspot) is the very tip: (50, 10). -->

  <!-- body: the silhouette. MacCursor fills it and draws the outline around it. -->
  <path id="body" fill="#7E57C2" d="M50 10 C58 22 70 34 70 48 A20 20 0 0 1 30 48 C30 34 42 22 50 10 Z"/>

  <!-- details: drawn on top of the body, in the order style.json lists them. -->
  <circle id="spot" fill="#FFFFFF" cx="50" cy="48" r="8"/>

  <!-- Click stamp and particle: drawn centred on the hotspot, hidden here so they don't
       get in the way while you draw. MacCursor ignores display="none". -->
  <circle id="stamp" display="none" fill="#000000" cx="50" cy="10" r="6"/>
  <polygon id="star" display="none" fill="#FFC107" points="50.00,4.00 51.53,7.90 55.71,8.15 52.47,10.80 53.53,14.85 50.00,12.60 46.47,14.85 47.53,10.80 44.29,8.15 48.47,7.90"/>
</svg>
